[package]
name = "app-copiloto-consultor"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# Desde el sprint 003 hay dos binarios: la app y `ghost`, la puerta local del lado de tu agente
# (ADR 018 §8). `tauri dev` y `cargo run` arrancan la app.
default-run = "app-copiloto-consultor"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_copiloto_consultor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.3.2"

# EL CORPUS — y solo el corpus. Estas cuatro viven del lado NO protegido de la frontera del
# efímero: leen los documentos PROPIOS del usuario, que es exactamente lo que la regla del
# efímero verificable permite persistir. Ninguna se asoma a `capture/`, `stt/` ni `voz/`.
#
# `tantivy` es el BM25 que pidió la orden. Cuesta 193 nodos y 16,7 s de compilación en frío
# (medido antes de comprometerla, no después); a cambio trae la tokenización y el stemming de
# los dos idiomas de la app, que es justo la parte que a mano se hace mal y en silencio.
tantivy = "0.26"
# Los dos lectores que no son texto plano. El .docx es un zip con XML dentro, así que se abre
# con las piezas y no con una librería de Word: menos superficie y ningún escritor de .docx
# enlazado en una app que jamás escribe .docx.
#
# `zip` 9 (sprint 009): la 2.4.2 tenía tres avisos de RustSec (0367, 0368 y 0369, este crítico: `extract` y los permisos
# por enlaces simbólicos) y `build-escritorio` los paró. La app solo LEE (`ZipArchive::new` + `by_name`, en
# `corpus/leer.rs`) y no llama a `extract`, pero la subida quita el aviso de raíz. En la 9, `deflate` trae además
# `zopfli`, que solo comprime: se pide solo el lector (`deflate-flate2-zlib-rs`), en Rust puro.
pdf-extract = "0.12"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.42"
# Para UNA cosa: el diálogo con el que el usuario señala su carpeta de documentos. La app no
# puede abrir un selector de carpetas sin él, y pedir la ruta escrita a mano sería empujar al
# usuario a teclear rutas en una app de escritorio.
tauri-plugin-dialog = "2"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
# El fondo de escritorio del relleno viaja a la webview como imagen en base64. Antes estaba solo en macOS y
# `relleno.rs` la usaba sin `cfg`: el crate no compilaba en ningún otro sistema (ADR 022). Ya viajaba en el árbol.
base64 = "0.22"

# Solo macOS, y solo para el ACOPLE y el RELLENO. Las cuatro ya viajaban en el árbol de Tauri
# (`cargo tree` las lista bajo tao/wry): declararlas aquí no añade una descarga, hace explícito
# que este crate las usa de primera mano y que la superficie nativa que tocamos son dos APIs del
# sistema — Accessibility (mover ventanas ajenas) y NSWorkspace (leer el fondo de escritorio) —
# y ninguna más.
# SHA-256 del modelo de whisper: en todas las plataformas, para probar la descarga en el Mac (ADR 022 §4).
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
# Solo para leer el desplazamiento horario del sistema y escribir «14:02» en un turno. Viajaba ya
# en el árbol (tao la usa); declararla hace explícito que este crate la llama de primera mano.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSWorkspace",
  "NSRunningApplication",
  "NSScreen",
  "NSResponder",
  "libc",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSString",
  "NSURL",
  "NSArray",
  "NSDictionary",
  "NSGeometry",
  "NSValue",
  "NSUUID",
] }

# **Windows, desde el sprint 006 (ADR 022): una capa hermana detrás de la misma frontera.** Cada una, para una cosa:
# - `cpal`: el micrófono por WASAPI, para la sala (`capture/windows.rs`).
# - `whisper-rs`: la transcripción local (`stt/whisper.rs`), el respaldo que el ADR 006 dejó escrito. Sin GPU.
# - `ureq` + `sha2`: la ÚNICA puerta a la red en Rust, para bajar el modelo de whisper cuando lo pides, con su huella
#   SHA-256 fija en el repo (`modelo_whisper.rs`); `contador-de-red` la cuenta y no deja que aparezca otra.
# - `chrono`: la hora local, que en macOS da `libc::localtime_r` (ya viajaba en el árbol).
# - `windows-sys`: el Credential Manager para tus notas, ensayos y bandeja (`llavero/windows.rs`) y la privacidad del
#   micrófono (`permisos.rs`), con las features mínimas.
# - `windows` (sprint 007, la videollamada): la misma 0.62 que ya trae `cpal`, así que no se compila dos veces. Para
#   la forma del dispositivo de salida (COM y sus propiedades), la reunión (procesos y ventanas), la voz al oído
#   (`Windows.Media.SpeechSynthesis`), la pantalla (`PrintWindow`, GDI) y su lectura (`Windows.Media.Ocr`). Ninguna
#   feature de red: la única puerta sigue siendo `ureq` en `modelo_whisper.rs`.
[target.'cfg(windows)'.dependencies]
cpal = "0.18"
whisper-rs = "0.16"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Sprint 012: la puerta local en Windows es un named pipe (`puerta/windows.rs`): crearlo con la DACL del usuario
# (Security, Authorization), esperarlo y leerlo sin bloquear (Pipes, IO, Threading) y abrirlo desde `ghost`
# (Storage_FileSystem) y, para `ghost --help`, el idioma del usuario (Globalization). Son features del mismo crate: ninguno nuevo
# en el árbol.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Credentials",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Threading",
] }
# `windows-future` (sprint 008): la que ya trae `windows`, nombrada para pedir Windows Hello con la ventana de la app
# (`IAsyncOperation` del resultado). No es un crate nuevo en el árbol.
windows-future = "0.3"
windows = { version = "0.62", features = [
  "Foundation",
  "Wdk_System_SystemServices",
  "Globalization",
  "Graphics_Imaging",
  "Media_Core",
  "Media_Ocr",
  "Media_SpeechSynthesis",
  "Security_Credentials_UI",
  "Storage_Streams",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Management_MobileDeviceManagementRegistration",
  "Win32_Media_Audio",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Ole",
  "Win32_System_SystemInformation",
  "Win32_System_TaskScheduler",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# **`panic = "abort"` estuvo aquí y tuvo que salir** (hallazgo A3 de la auditoría del sprint 001).
# Lo traía la plantilla de Tauri para adelgazar el binario, y en esta app anulaba en silencio el
# `catch_unwind` de `corpus::leer::de_pdf`: la librería de PDF se rompe con archivos malformados
# —por eso está envuelta— y con `abort` el proceso no se desenreda, se muere. El módulo prometía
# que «un documento dañado no detiene a los otros», su test lo comprobaba en debug, y en el binario
# que se distribuye **un solo PDF roto de la carpeta del usuario cerraba la app**. Es el tercer filo
# de la regla de los gates: probado, pero no en el modo en que el usuario lo usa.
#
# Lo que cuesta, MEDIDO en este Mac y no estimado: el binario de release pasa de **9,01 MB a
# 11,07 MB** (+2,07 MB, +22,9 %). Son las tablas de desenredo, y es mucho para un número que se
# anota por PR — pero la alternativa es que la app se cierre la primera vez que alguien le señale
# una carpeta con un PDF malformado, que es el caso normal de una carpeta de verdad. Se paga y se
# declara. Lo vigila `el_perfil_de_release_desenreda` en `corpus/leer.rs`.
strip = true

[dev-dependencies]
serde_json = "1"
# Solo para el kit de pantalla: leer las imágenes sintéticas de `docs/kit-de-prueba/pantalla/` y
# pasárselas a Vision como las pasaría la captura. Ya viajaba en el árbol (la usa Tauri para los
# iconos): declararla aquí no añade una descarga, y NO entra en el binario — es de los tests.
png = "0.17"
