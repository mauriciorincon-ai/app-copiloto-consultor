[package]
name = "app-copiloto-consultor"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_copiloto_consultor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.3.2"

# EL CORPUS — y solo el corpus. Estas cuatro viven del lado NO protegido de la frontera del
# efímero: leen los documentos PROPIOS del usuario, que es exactamente lo que la regla del
# efímero verificable permite persistir. Ninguna se asoma a `capture/`, `stt/` ni `voz/`.
#
# `tantivy` es el BM25 que pidió la orden. Cuesta 193 nodos y 16,7 s de compilación en frío
# (medido antes de comprometerla, no después); a cambio trae la tokenización y el stemming de
# los dos idiomas de la app, que es justo la parte que a mano se hace mal y en silencio.
tantivy = "0.26"
# Los dos lectores que no son texto plano. El .docx es un zip con XML dentro, así que se abre
# con las piezas y no con una librería de Word: menos superficie y ningún escritor de .docx
# enlazado en una app que jamás escribe .docx.
pdf-extract = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
# Para UNA cosa: el diálogo con el que el usuario señala su carpeta de documentos. La app no
# puede abrir un selector de carpetas sin él, y pedir la ruta escrita a mano sería empujar al
# usuario a teclear rutas en una app de escritorio.
tauri-plugin-dialog = "2"

# Solo macOS, y solo para el ACOPLE y el RELLENO. Las cuatro ya viajaban en el árbol de Tauri
# (`cargo tree` las lista bajo tao/wry): declararlas aquí no añade una descarga, hace explícito
# que este crate las usa de primera mano y que la superficie nativa que tocamos son dos APIs del
# sistema — Accessibility (mover ventanas ajenas) y NSWorkspace (leer el fondo de escritorio) —
# y ninguna más.
[target.'cfg(unix)'.dependencies]
# Solo para leer el desplazamiento horario del sistema y escribir «14:02» en un turno. Viajaba ya
# en el árbol (tao la usa); declararla hace explícito que este crate la llama de primera mano.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
base64 = "0.22"
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSWorkspace",
  "NSRunningApplication",
  "NSScreen",
  "NSResponder",
  "libc",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSString",
  "NSURL",
  "NSArray",
  "NSDictionary",
  "NSGeometry",
  "NSValue",
  "NSUUID",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
