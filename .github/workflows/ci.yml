# CI del kit-app — PERFIL ESCRITORIO (Tauri; kit v1.27.0). Lo instala el estampador con
# `--perfil escritorio` EN LUGAR de ci.yml. Misma filosofia que el perfil web: todo gate nace
# con su DEMO en rojo (metodo v1.12.0) y todo job que pueda ponerse rojo sube su evidencia
# (kit v1.26.0). Diferencias con el perfil web:
#   - NO hay Vercel ni Lighthouse: la app no se sirve, se DISTRIBUYE como binario firmado.
#   - e2e corre sobre la UI (webview) servida por Vite `preview`; lo nativo (audio, ventana
#     protegida, permisos) se prueba con `cargo test` y con el gate ⭐ del usuario — un e2e
#     de navegador NO puede ver si una ventana aparece en una pantalla compartida.
#   - `build-escritorio` compila el crate en macOS (cargo check + cargo test); el bundle
#     completo (`pnpm tauri build`) se corre en /release-check, no en cada PR (tiempo).
name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6   # SIN `version`: la lee de "packageManager" del package.json (fuente unica, kit v1.10.2)
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # gitleaks, con versión y huella fijas (auditoría del S5, B8): la prueba del hook de secretos (`hook-secretos.test.ts`)
      # tiene una mitad que bloquea la carnada canónica y la mitad se saltaba en la CI porque el runner no lo trae.
      - name: gitleaks 8.30.1 (versión y huella fijas)
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      - run: pnpm peers check
      # Regla 18 del kit (v1.32.0; falla CERRADO desde v1.35.0): ningun paquete queda por debajo de
      # `main`. La plantilla de escritorio del kit no lo trae (K-S4, bitacora del sprint 004): se
      # copia de la web. Su rojo: un `jsdom` bajado a mano en el lockfile (bitacora, fase 0).
      - name: Regla 18 — ningun paquete por debajo de main (kit v1.32.0)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth=1
          node scripts/verificar-dependencias.mjs origin/main
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test            # vitest run --coverage (umbral en vitest.config)
      - run: pnpm build           # build del frontend (Vite) — el binario va en build-escritorio
      - run: pnpm audit --audit-level high
      # kit v2.0.0 — regla 17 (cero enlaces) pasa de casilla manual a gate de CI (adoptado en el sprint 006; el
      # perfil escritorio del kit no lo traía, K-S6). La produccion se MUESTRA, jamas se ENTREGA. Dos superficies:
      # los archivos versionados (git grep) y el campo `homepage` del repo en GitHub. Los dominios salen de
      # cero-enlaces.json. Demo en rojo: tests/unit/cero-enlaces.test.ts.
      - name: Cero enlaces — árbol y homepage del repo (regla 17, kit v2.0.0)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HOMEPAGE="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.homepage // ""')"
          node scripts/cero-enlaces.mjs --homepage "$HOMEPAGE"

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e        # UI de la webview via `pnpm preview` (playwright.config) + axe
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  build-escritorio:
    runs-on: macos-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      # `cargo audit` (auditoria del S3, M12): la DoD de Seguridad lo pide y se corria a mano, una vez
      # por sprint. Va PRIMERO: solo lee el Cargo.lock, asi que un aviso de RustSec falla en segundos,
      # antes de compilar nada. Falla con vulnerabilidades; los avisos de «sin mantener» o «unsound»
      # no bloquean (hoy son 9, anotados en la bitacora). Las subidas de Rust son a mano, sin
      # dependabot de Cargo (decision del usuario, 2026-09-28): este paso es el que avisa.
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-audit }
      - name: cargo audit (vulnerabilidades conocidas de RustSec)
        working-directory: src-tauri
        run: cargo audit
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # `cargo clippy` lo EXIGE el /release-check desde el estampado y NINGUN job lo corria: se
      # ejecutaba cuando alguien se acordaba, que es la definicion de gate decorado (regla 15,
      # segunda pregunta). Entro aqui —no en un job nuevo— para no tocar la ruleset. Su rojo no
      # hubo que fabricarlo: al correrlo por primera vez en el /release-check del S1 estaba en
      # rojo por un `mut` de mas en un test de `escucha`.
      - name: cargo clippy (el gate que el checklist pedia y nadie corria)
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo check (crate de Tauri)
        working-directory: src-tauri
        run: cargo check --locked
      # REGLA 25 del kit (v1.36.0; en esta app, dentro de la regla 22): `cargo test` a secas no abre
      # micrófono, audio del sistema, altavoces, Accessibility, Llavero, desbloqueo ni launchd. Lo
      # demuestra este paso, no una promesa: con AG_SIN_HARDWARE=1 cada entrada nativa ABORTA el
      # binario antes de cruzar a C (`src-tauri/src/hardware.rs`), asi que un test que abra algo sin
      # su `#[ignore = "hardware: …"]` tumba el paso con el nombre de lo que iba a abrir. Su rojo,
      # en la bitacora del sprint 004 (fase 0).
      - name: cargo test a secas — sin hardware (regla 25, con el centinela armado)
        working-directory: src-tauri
        env: { AG_SIN_HARDWARE: "1" }
        run: cargo test --locked
      # Y lo que si toca el Mac lo corre la CI, que no es el Mac de nadie. Los `en_vivo_*` necesitan
      # al usuario delante (una ventana de Meet, su Llavero, launchd ≈ 2 min): se corren a mano, con
      # su matriz y su «sí».
      - name: cargo test con hardware (los #[ignore] de la regla 25; los en_vivo_ se corren a mano)
        working-directory: src-tauri
        run: cargo test --locked -- --include-ignored --skip en_vivo_
      # EVIDENCIA, no un gate nuevo — y conviene decirlo para que nadie lo cuente como uno mas.
      # Los tests del kit (WER, nDCG@5, disparador) SOLO pueden medir o saltarse: si este runner
      # no trae los modelos de voz de macOS, salen `ok` habiendose saltado, y `ok` no distingue las
      # dos cosas. Desde el sprint 002 vale igual para la voz que SALE: un runner sin voces
      # instaladas ni dispositivo de audio deja el puente de `AVSpeechSynthesizer` sin cruzar, y el
      # test lo dice con todas las letras en vez de salir `ok` a secas. Sin --nocapture, cargo se come la salida de los tests que pasan y el log de la CI
      # no deja saber si el kit midio algo. Esto vuelve a correrlos (la compilacion ya esta en
      # cache) solo para que sus numeros queden escritos. No anade ninguna forma nueva de fallar:
      # falla si y solo si fallan ellos, que ya los corrio el paso de arriba.
      # `el_radar` (sprint 002, fase 4): el ambar con el OCR de verdad sale antes diciendo «NO SE
      # MIDIO» si la compilacion no trae el puente de Swift; su primera corrida en CI paso `ok` sin
      # que el log dijera cual de las dos cosas habia pasado.
      - name: el kit, con su salida (porque «ok» no dice si midio)
        working-directory: src-tauri
        run: cargo test --locked --test contra-el-mac-de-verdad -- --include-ignored --nocapture el_kit el_wer la_voz_de_este_mac la_app_nunca el_radar
      # GATE de las maquetas (sprint 002, fase 3): ningun estado de ninguna maqueta se sale de su
      # ventana. Va AQUI y no en `e2e` porque las maquetas usan las fuentes de macOS (Avenir Next,
      # Charter, Menlo): en el runner de Linux todo envuelve distinto y daba desbordes que en un Mac
      # no existen. En `e2e` se salta diciendolo; aqui tiene conclusion propia.
      - name: las maquetas caben en su ventana (con las fuentes de macOS)
        run: |
          pnpm exec playwright install chromium
          pnpm exec playwright test tests/e2e/maqueta-cabe.spec.ts --project=ventana-principal
      # Gate de NO PERSISTENCIA (estandar 4-T, captura de terceros): si la app capta audio o
      # pantalla de terceros, `pnpm verify:ephemeral` debe existir y pasar. Sin el script el
      # gate NO se salta en silencio: falla (un gate saltado se ve igual que uno verde).
      - name: verify:ephemeral (solo apps que captan a terceros)
        run: |
          if jq -e '.scripts["verify:ephemeral"]' package.json >/dev/null; then pnpm verify:ephemeral; \
          elif grep -q 'captura_terceros: true' CLAUDE.md 2>/dev/null; then echo "::error::CLAUDE.md declara captura_terceros pero no existe el script verify:ephemeral"; exit 1; \
          else echo "app sin captura de terceros: gate no aplica"; fi

  # ADR 022 (sprint 006): **Windows detrás de la misma frontera.** El mismo crate, compilado y probado en Windows, y el
  # instalador como artifact del PR (sin firmar hasta G-Release: SmartScreen avisará, el manual dice cómo pasar). Lo que
  # es de macOS no corre aquí: ni clippy con el puente de Swift, ni el kit de voz, ni las maquetas, ni `cargo audit`
  # (lee el mismo Cargo.lock: una vez basta, en `build-escritorio`). Whisper (whisper.cpp con MSVC y cmake) SOLO se
  # compila aquí. Desde el sprint 007 el job baja el modelo pequeño (con su huella) para medir la transcripción, y desde
  # el 008 lo usa en una sesión completa (regla 1) y trae el OCR y la voz del sistema contra fixtures; la latencia que
  # vale es la del PC del usuario, no la del runner.
  # Techo: el plan declaró 25 min; la primera corrida mide el real, y el cierre del sprint lo dice.
  build-windows:
    runs-on: windows-latest
    needs: quality
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # La `key` es nueva a propósito (sprint 009, auditoría A2): las cachés anteriores guardaban whisper.cpp compilado
      # para la CPU del runner que las creó (AVX-512 incluido) y en otro runner morían con STATUS_ILLEGAL_INSTRUCTION.
      # Desde `GGML_NATIVE=OFF` (src-tauri/.cargo/config.toml) el binario es portable; la clave nueva las deja atrás.
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri, key: ggml-portable }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # vitest TAMBIÉN en Windows (sprint 010): los tests que miran rutas, el hook de secretos con Git Bash, el diccionario por
      # USERPROFILE y los gates de «sin Mac» corren aquí, no solo en Linux. Un `path.sep` que vuelva a colarse deja de ser
      # algo que solo una Surface ve (el test `ci-vitest-en-windows` exige este paso en los dos jobs).
      - name: vitest en Windows (con su cobertura)
        run: pnpm test
      - run: pnpm build
      # REGLA 25 en Windows: `cargo test` a secas no abre el micrófono ni el Administrador de credenciales; con
      # AG_SIN_HARDWARE=1 cada entrada nativa nueva (cpal, whisper, Credential Manager) aborta antes de cruzar.
      - name: cargo test a secas — sin hardware (regla 25, en Windows)
        working-directory: src-tauri
        env: { AG_SIN_HARDWARE: "1" }
        run: cargo test --locked
      # Lo marcado `hardware:` que sí se puede correr aquí: el Administrador de credenciales DEL RUNNER, una máquina
      # efímera de GitHub (regla 24: jamás el PC del usuario). El micrófono lleva `en_vivo_` y se salta; la descarga del
      # modelo se prueba en `cargo test` con un archivo falso (`modelo_whisper::descargar_a`), en el Mac y en Windows.
      - name: el Administrador de credenciales de verdad — en el runner efímero
        working-directory: src-tauri
        run: cargo test --locked --lib llavero -- --include-ignored --skip en_vivo_
      # SPRINT 007 (decisión 3 del plan): whisper con dos pistas, medido en el runner con el modelo pequeño. La cifra es
      # del runner y se declara `manual`: la del PC del usuario manda, en el gate del hito. El modelo se baja con la
      # huella SHA-256 de `modelo_whisper.rs` y se guarda en la caché de Actions para no bajarlo en cada corrida.
      - uses: actions/cache@v6
        with:
          path: ~/ag-modelos
          key: whisper-ggml-small-1be3a9b2
      - name: el modelo pequeño de whisper, con su huella
        shell: pwsh
        run: |
          $ruta = Join-Path $HOME "ag-modelos\ggml-small.bin"
          if (-not (Test-Path $ruta)) {
            New-Item -ItemType Directory -Force (Split-Path $ruta) | Out-Null
            # La misma revisión fija que `modelo_whisper.rs::REVISION` (B12 del S7: `main` se mueve), y con reintentos:
            # una caída pasajera del servidor no tumba el job.
            Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-small.bin" -OutFile $ruta -MaximumRetryCount 4 -RetryIntervalSec 15
          }
          $huella = (Get-FileHash $ruta -Algorithm SHA256).Hash.ToLower()
          if ($huella -ne "1be3a9b2063867b937e64e2ec7483364a79917e157fa98c5d94b5c1fffea987b") {
            Remove-Item $ruta
            throw "la huella del modelo pequeño no coincide: $huella"
          }
          "AG_MODELO_WHISPER=$ruta" | Out-File -FilePath $env:GITHUB_ENV -Append
      # M6 del S7: la voz y el OCR de Windows contra fixtures del kit. El OCR necesita el paquete de reconocimiento de
      # texto del idioma: se comprueba y, si falta, se instala (capacidad de Windows, en el runner efímero).
      - name: el reconocimiento de texto de Windows (inglés)
        shell: pwsh
        run: |
          $c = Get-WindowsCapability -Online -Name "Language.OCR~~~en-US*" | Select-Object -First 1
          "OCR en-US: $($c.Name) · $($c.State)"
          if ($c.State -ne "Installed") { Add-WindowsCapability -Online -Name $c.Name | Out-Host }
      - name: la pantalla y la voz de Windows contra fixtures (M6 del S7)
        working-directory: src-tauri
        run: cargo test --locked --test pantalla-y-voz-en-windows -- --include-ignored --nocapture
      # M11 del S6: la mitad en marcha de la regla 1, en Windows. Una sesión completa con whisper de verdad (el modelo
      # pequeño que acaba de bajarse) y el disco inventariado antes y después: ni un archivo nuevo en la carpeta de la
      # app fuera de `modelos/`, ni la transcripción del cliente en la carpeta temporal.
      - name: una sesión completa no deja nada en el disco (regla dura 1, en Windows)
        working-directory: src-tauri
        run: cargo test --locked --test efimero-en-windows -- --include-ignored --nocapture
      - name: whisper con dos pistas en este runner (medición, manual)
        working-directory: src-tauri
        run: cargo test --locked --lib medicion_whisper_con_dos_pistas -- --ignored --nocapture
      - name: el instalador de Windows (.msi y .exe, sin firmar)
        run: pnpm tauri build --bundles msi,nsis
      - uses: actions/upload-artifact@v7
        with:
          name: angel-ghost-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  # SPRINT 009 (La Surface): **Windows ARM64 nativo.** El mismo crate, compilado y probado en un runner ARM de verdad, y el
  # instalador ARM64 como artifact del PR (sin firmar hasta G-Release). Es la mitad de ARM de `build-windows`: lo que allí
  # necesita un modelo de voz, el OCR o una sesión completa no se repite aquí (la latencia que vale es la de la Surface,
  # medida en ella; ADR 022, enmienda 3). Lo que SÍ es de ARM y solo se ve aquí:
  #   - ggml no compila con MSVC en ARM («use clang»): `src-tauri/.cargo/config.toml` y `cmake/windows-arm64-clang-cl.cmake`
  #     compilan whisper.cpp con clang-cl y Ninja, y `bindgen` necesita una `libclang.dll` ARM64 (se carga DENTRO de cargo).
  #   - el binario es portable (`GGML_NATIVE=OFF`): lo que sube este job corre en la Surface, no solo en el runner.
  #   - `scripts/arquitectura-pe.mjs`: el artefacto que se llama ARM64 tiene que SER ARM64.
  # El runner `windows-11-arm` es gratis para repos públicos. Si GitHub no lo diera, este job se retira y el cierre lo dice.
  build-windows-arm:
    runs-on: windows-11-arm
    needs: quality
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # vitest TAMBIÉN en Windows (sprint 010): los tests que miran rutas, el hook de secretos con Git Bash, el diccionario por
      # USERPROFILE y los gates de «sin Mac» corren aquí, no solo en Linux. Un `path.sep` que vuelva a colarse deja de ser
      # algo que solo una Surface ve (el test `ci-vitest-en-windows` exige este paso en los dos jobs).
      - name: vitest en Windows (con su cobertura)
        run: pnpm test
      - run: pnpm build
      # La cadena nativa de ARM64, VERIFICADA (no se da por buena por el nombre del runner): el compilador de C++ ARM64 de
      # Visual Studio y una `libclang.dll` ARM64. Lo que falte se pone: el componente con el instalador de Visual Studio, y
      # LLVM ARM64 de su release oficial, con la huella SHA-256 fija (leída de la propia release el 2026-10-17) y extraído
      # sin instalar (`msiexec /a`), para no pisar el LLVM del runner. Cada paso dice qué encontró.
      # OJO, declarado en el sprint 009: en la primera corrida verde el runner YA traía las dos cosas (Visual Studio con
      # `VC.Tools.ARM64` y un LLVM con `libclang` ARM64), así que las dos ramas de respaldo NO se han ejecutado nunca. La
      # verificación sí corre cada vez; los respaldos se estrenarán el día que la imagen del runner cambie.
      - name: La cadena nativa de ARM64 (se verifica; lo que falte se instala, con huella)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Arquitectura([string]$ruta) {
            $b = New-Object byte[] 4096
            $fs = [System.IO.File]::OpenRead($ruta); try { [void]$fs.Read($b, 0, $b.Length) } finally { $fs.Close() }
            $pe = [BitConverter]::ToInt32($b, 0x3C)
            switch ([BitConverter]::ToUInt16($b, $pe + 4)) { 0xAA64 { 'arm64' } 0x8664 { 'x64' } default { 'otra' } }
          }
          "Runner: $env:PROCESSOR_ARCHITECTURE · $((Get-CimInstance Win32_OperatingSystem).Caption)"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -property installationPath
          "Visual Studio: $vs"
          $componente = 'Microsoft.VisualStudio.Component.VC.Tools.ARM64'
          if (-not (& $vswhere -latest -products * -requires $componente -property installationPath)) {
            "Falta ${componente}: se instala con el Visual Studio Installer."
            $p = Start-Process (Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe') -Wait -PassThru -ArgumentList @(
              'modify', '--installPath', "`"$vs`"", '--add', $componente, '--quiet', '--norestart', '--noUpdateInstaller')
            "setup.exe salió con $($p.ExitCode)"
            if (-not (& $vswhere -latest -products * -requires $componente -property installationPath)) { throw "$componente sigue sin estar" }
          }
          "OK $componente"
          $bin = $null
          $propio = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (Test-Path (Join-Path $propio 'libclang.dll')) {
            $a = Arquitectura (Join-Path $propio 'libclang.dll')
            "LLVM del runner: $propio · libclang $a"
            if ($a -eq 'arm64') { $bin = $propio }
          } else { "El runner no trae LLVM en $propio" }
          if (-not $bin) {
            $msi = Join-Path $env:RUNNER_TEMP 'LLVM-23.1.3-woa64.msi'
            Invoke-WebRequest -Uri 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/LLVM-23.1.3-woa64.msi' -OutFile $msi -MaximumRetryCount 4 -RetryIntervalSec 15
            $huella = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
            if ($huella -ne '19750061816ff721966dff175288e940889aae2dd6e8643eaf9a14a03ee728ed') { throw "la huella de LLVM no coincide: $huella" }
            $destino = Join-Path $env:RUNNER_TEMP 'llvm-arm64'
            $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/a', "`"$msi`"", '/qn', "TARGETDIR=`"$destino`"")
            "msiexec /a salió con $($p.ExitCode)"
            $dll = Get-ChildItem $destino -Recurse -Filter libclang.dll | Select-Object -First 1
            if (-not $dll) { throw "el MSI de LLVM no dejó libclang.dll en $destino" }
            $bin = $dll.DirectoryName
          }
          if ((Arquitectura (Join-Path $bin 'libclang.dll')) -ne 'arm64') { throw "libclang de $bin no es ARM64" }
          "libclang ARM64 en $bin"
          "LIBCLANG_PATH=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          "AG_LLVM_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append   # `ring` compila su C con `clang` en Windows ARM64
      - name: cargo test a secas — sin hardware (regla 25, en Windows ARM64)
        working-directory: src-tauri
        env: { AG_SIN_HARDWARE: "1" }
        run: cargo test --locked
      - name: los instaladores de Windows ARM64 (.msi y .exe, sin firmar)
        run: pnpm tauri build --bundles msi,nsis
      # Antes de subir nada: lo que se construyó ES ARM64. El stub del instalador NSIS es x86 a propósito (corre emulado y
      # solo descomprime), así que se miran los binarios de la app, que son los que importan.
      - name: la arquitectura de lo construido (sprint 009)
        run: node scripts/arquitectura-pe.mjs --espera arm64 src-tauri/target/release/app-copiloto-consultor.exe src-tauri/target/release/ghost.exe
      - uses: actions/upload-artifact@v7
        with:
          name: angel-ghost-windows-arm64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
