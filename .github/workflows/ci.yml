# CI del kit-app — PERFIL ESCRITORIO (Tauri; kit v1.27.0). Lo instala el estampador con
# `--perfil escritorio` EN LUGAR de ci.yml. Misma filosofia que el perfil web: todo gate nace
# con su DEMO en rojo (metodo v1.12.0) y todo job que pueda ponerse rojo sube su evidencia
# (kit v1.26.0). Diferencias con el perfil web:
#   - NO hay Vercel ni Lighthouse: la app no se sirve, se DISTRIBUYE como binario firmado.
#   - e2e corre sobre la UI (webview) servida por Vite `preview`; lo nativo (audio, ventana
#     protegida, permisos) se prueba con `cargo test` y con el gate ⭐ del usuario — un e2e
#     de navegador NO puede ver si una ventana aparece en una pantalla compartida.
#   - `build-escritorio` compila el crate en macOS (cargo check + cargo test); el bundle
#     completo (`pnpm tauri build`) se corre en /release-check, no en cada PR (tiempo).
name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6   # SIN `version`: la lee de "packageManager" del package.json (fuente unica, kit v1.10.2)
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test            # vitest run --coverage (umbral en vitest.config)
      - run: pnpm build           # build del frontend (Vite) — el binario va en build-escritorio
      - run: pnpm audit --audit-level high

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e        # UI de la webview via `pnpm preview` (playwright.config) + axe
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  build-escritorio:
    runs-on: macos-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # `cargo clippy` lo EXIGE el /release-check desde el estampado y NINGUN job lo corria: se
      # ejecutaba cuando alguien se acordaba, que es la definicion de gate decorado (regla 15,
      # segunda pregunta). Entro aqui —no en un job nuevo— para no tocar la ruleset. Su rojo no
      # hubo que fabricarlo: al correrlo por primera vez en el /release-check del S1 estaba en
      # rojo por un `mut` de mas en un test de `escucha`.
      - name: cargo clippy (el gate que el checklist pedia y nadie corria)
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo check + test (crate de Tauri)
        working-directory: src-tauri
        run: |
          cargo check --locked
          cargo test --locked
      # EVIDENCIA, no un gate nuevo — y conviene decirlo para que nadie lo cuente como uno mas.
      # Los tests del kit (WER, nDCG@5, disparador) SOLO pueden medir o saltarse: si este runner
      # no trae los modelos de voz de macOS, salen `ok` habiendose saltado, y `ok` no distingue las
      # dos cosas. Desde el sprint 002 vale igual para la voz que SALE: un runner sin voces
      # instaladas ni dispositivo de audio deja el puente de `AVSpeechSynthesizer` sin cruzar, y el
      # test lo dice con todas las letras en vez de salir `ok` a secas. Sin --nocapture, cargo se come la salida de los tests que pasan y el log de la CI
      # no deja saber si el kit midio algo. Esto vuelve a correrlos (la compilacion ya esta en
      # cache) solo para que sus numeros queden escritos. No anade ninguna forma nueva de fallar:
      # falla si y solo si fallan ellos, que ya los corrio el paso de arriba.
      - name: el kit, con su salida (porque «ok» no dice si midio)
        working-directory: src-tauri
        run: cargo test --locked --test contra-el-mac-de-verdad -- --nocapture el_kit el_wer la_voz_de_este_mac la_app_nunca
      # Gate de NO PERSISTENCIA (estandar 4-T, captura de terceros): si la app capta audio o
      # pantalla de terceros, `pnpm verify:ephemeral` debe existir y pasar. Sin el script el
      # gate NO se salta en silencio: falla (un gate saltado se ve igual que uno verde).
      - name: verify:ephemeral (solo apps que captan a terceros)
        run: |
          if jq -e '.scripts["verify:ephemeral"]' package.json >/dev/null; then pnpm verify:ephemeral; \
          elif grep -q 'captura_terceros: true' CLAUDE.md 2>/dev/null; then echo "::error::CLAUDE.md declara captura_terceros pero no existe el script verify:ephemeral"; exit 1; \
          else echo "app sin captura de terceros: gate no aplica"; fi
